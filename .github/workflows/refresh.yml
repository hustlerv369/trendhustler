name: Daily Data Refresh

on:
  schedule:
    - cron: '0 6 * * *'   # every day at 6am UTC (8am CET / 7am GMT)
  workflow_dispatch:        # also allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install yt-dlp
        run: pip install yt-dlp --quiet

      - name: Refresh data + build dashboard
        run: npm run build

      - name: Commit + push updated data
        run: |
          git config user.name "TrendHustler Bot"
          git config user.email "trendhustler-bot@users.noreply.github.com"
          git add data/data.json index.html
          git diff --staged --quiet && echo "No changes today." || (
            git commit -m "chore: daily refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          )
